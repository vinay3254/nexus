<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; background:#17221d; overflow:hidden; }
  body { display:grid; place-items:center; }
  .splash { position:relative; width:min(72vmin, 560px); aspect-ratio: 464 / 635; }
  .trace, .logo { position:absolute; inset:0; width:100%; height:100%; }
  .trace { overflow:visible; }
  .outline {
    fill:none; stroke:#f4f4f4; stroke-width:2.4; stroke-linejoin:round;
    stroke-linecap:round; stroke-dasharray:var(--length); stroke-dashoffset:var(--length);
    filter:drop-shadow(0 0 5px rgba(255,255,255,.28));
    animation: draw 1.35s cubic-bezier(.65,0,.25,1) forwards;
  }
  .silhouette {
    fill:url(#metal); opacity:0;
    animation: fillIn .7s ease-out 1.28s forwards;
  }
  .logo {
    opacity:0; object-fit:contain;
    animation: revealLogo .85s ease-out 1.8s forwards;
  }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fillIn { to { opacity:1; } }
  @keyframes revealLogo { to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .outline { stroke-dashoffset:0; animation:none; }
    .silhouette, .logo { opacity:1; animation:none; }
  }
</style>
